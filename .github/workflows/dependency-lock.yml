name: Resolve patched packaging lock
on:
  pull_request:
    paths: ['desktop/package.json', 'desktop/vendor/**', '.github/workflows/dependency-lock.yml']
permissions:
  contents: read
jobs:
  lock:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - run: |
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts
          npm ci --ignore-scripts
          node --test tests/packaging-globs.test.cjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: patched-dependency-lock
          path: desktop/package-lock.json
      - run: npm audit --audit-level=moderate
