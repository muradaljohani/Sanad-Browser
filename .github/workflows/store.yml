name: Sanad Microsoft Store package
on:
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/store.yml']
  pull_request:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/store.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: store-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  msix:
    runs-on: windows-latest
    outputs:
      submission-ready: ${{ steps.identity.outputs.ready }}
    timeout-minutes: 25
    defaults:
      run:
        working-directory: desktop
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      CSC_LINK: ''
      CSC_KEY_PASSWORD: ''
      WIN_CSC_LINK: ''
      WIN_CSC_KEY_PASSWORD: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: node --test tests/store-package.test.cjs
      - name: Generate Store tiles from the existing Sanad icon
        shell: pwsh
        run: ./scripts/prepare-store-assets.ps1
      - name: Build isolated CI MSIX
        run: npm run dist:store
        env:
          SANAD_STORE_BUILD_KIND: ci-test
      - name: Install and test the CI-only package
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          ./scripts/test-store-package.ps1 -PackagePath "dist-store-ci/Sanad-Browser-$($package.version)-x64-CI-ONLY.msix"
      - name: Check Partner Center identity availability
        id: identity
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: pwsh
        env:
          SANAD_STORE_IDENTITY_NAME: ${{ vars.SANAD_STORE_IDENTITY_NAME }}
          SANAD_STORE_PUBLISHER: ${{ vars.SANAD_STORE_PUBLISHER }}
          SANAD_STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.SANAD_STORE_PUBLISHER_DISPLAY_NAME }}
          SANAD_STORE_DISPLAY_NAME: ${{ vars.SANAD_STORE_DISPLAY_NAME }}
        run: |
          $ready = $env:SANAD_STORE_IDENTITY_NAME -and $env:SANAD_STORE_PUBLISHER -and $env:SANAD_STORE_PUBLISHER_DISPLAY_NAME -and $env:SANAD_STORE_DISPLAY_NAME
          if (-not $ready) {
            'ready=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Output '::notice::Submission package awaits the exact reserved Partner Center identity. CI fixtures are not published or submitted.'
          } else { 'ready=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8 }
      - name: Build actual Microsoft Store submission package
        if: steps.identity.outputs.ready == 'true'
        run: npm run dist:store
        env:
          SANAD_STORE_BUILD_KIND: submission
          SANAD_STORE_IDENTITY_NAME: ${{ vars.SANAD_STORE_IDENTITY_NAME }}
          SANAD_STORE_PUBLISHER: ${{ vars.SANAD_STORE_PUBLISHER }}
          SANAD_STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.SANAD_STORE_PUBLISHER_DISPLAY_NAME }}
          SANAD_STORE_DISPLAY_NAME: ${{ vars.SANAD_STORE_DISPLAY_NAME }}
      - name: Prepare Store upload archive and checksums
        if: steps.identity.outputs.ready == 'true'
        shell: pwsh
        run: ./scripts/create-store-upload.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.identity.outputs.ready == 'true'
        with:
          name: windows-store-submission
          path: |
            desktop/dist-store/*-Store.msix
            desktop/dist-store/*.msixupload
            desktop/dist-store/SHA256-store.txt
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-store-proof
          path: desktop/test-results/store/
          if-no-files-found: ignore
          retention-days: 30

  submission-draft:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.msix.outputs.submission-ready == 'true'
    needs: msix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-store-submission
          path: store-package
      - name: Verify the Store submission checksums
        working-directory: store-package
        run: sha256sum --check SHA256-store.txt
      - name: Stage a maintainer-only Store upload draft
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          files=(store-package/*-Store.msixupload)
          [[ ${#files[@]} -eq 1 && -f "${files[0]}" ]]
          sanad_name=$(basename "${files[0]}")
          sanad_version=${sanad_name#Sanad-Browser-}
          sanad_version=${sanad_version%-x64-Store.msixupload}
          [[ "$sanad_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          sanad_tag="store-submission-v$sanad_version"
          if sanad_existing=$(gh release view "$sanad_tag" --repo "$GITHUB_REPOSITORY" --json isDraft,targetCommitish --jq '[.isDraft,.targetCommitish] | @tsv' 2>/dev/null); then
            IFS=$'\t' read -r sanad_draft sanad_target <<< "$sanad_existing"
            [[ "$sanad_draft" == 'true' && "$sanad_target" == "$GITHUB_SHA" ]] || { echo 'Existing submission version targets another revision. Increment the version; do not overwrite it.'; exit 1; }
            echo 'Existing matching maintainer draft retained without replacing package bytes.'
            exit 0
          fi
          gh release create "$sanad_tag" "${files[0]}" store-package/SHA256-store.txt --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" --title "Microsoft Store submission $sanad_version (maintainers)" --notes "Maintainer upload package for Microsoft Partner Center. Source: $GITHUB_SHA. This is an unsigned Store submission archive, not an end-user installer. Keep this release in draft. The signed public installer remains at https://ip-murad.com/browser/download/."

